version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  coordinator-service:
    build: ./CoordinatorService
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  table-service:
    build: ./TableService
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 180s

  philosopher-plato:
    build: ./PhilosopherService
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Платон
      - PHILOSOPHER_ID=philosopher-1
      - LEFT_FORK_ID=1
      - RIGHT_FORK_ID=2
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"

  philosopher-aristotle:
    build: ./PhilosopherService
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Аристотель
      - PHILOSOPHER_ID=philosopher-2
      - LEFT_FORK_ID=2
      - RIGHT_FORK_ID=3
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8081"

  philosopher-socrates:
    build: ./PhilosopherService
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Сократ
      - PHILOSOPHER_ID=philosopher-3
      - LEFT_FORK_ID=3
      - RIGHT_FORK_ID=4
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8081"

  philosopher-descartes:
    build: ./PhilosopherService
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Декарт
      - PHILOSOPHER_ID=philosopher-4
      - LEFT_FORK_ID=4
      - RIGHT_FORK_ID=5
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8081"

  philosopher-kant:
    build: ./PhilosopherService
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Кант
      - PHILOSOPHER_ID=philosopher-5
