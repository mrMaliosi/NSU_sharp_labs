      - RIGHT_FORK_ID=1
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      table-service:
